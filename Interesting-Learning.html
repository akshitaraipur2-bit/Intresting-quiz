<style>
:root{--bg:#fff4d6;--fg:#2b2b3a;--card:#fff;--ac:#2f8cff;--ok:#2fbf71;--no:#ef5b5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2b;--fg:#f4f0ff;--card:#2e2a47}}
:root[data-theme="dark"]{--bg:#1d1b2b;--fg:#f4f0ff;--card:#2e2a47}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Fredoka","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;min-height:100%}
#app{max-width:640px;margin:auto;padding:16px;text-align:center}
h1{font-size:2.6rem;margin:.2em 0;color:var(--ac)}h2{margin:.3em 0}
.big{font-size:4.5rem;display:inline-block}
.bounce{animation:b 1s infinite}.dance{animation:d .6s infinite}.shake{animation:s .4s}
@keyframes b{50%{transform:translateY(-14px)}}@keyframes d{25%{transform:rotate(-12deg) translateX(-8px) scale(1.08)}75%{transform:rotate(12deg) translateX(8px) scale(1.08)}}
@keyframes s{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.hop{animation:hop .7s infinite ease-in-out}@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22px) rotate(4deg)}}.arm{transform-box:fill-box;transform-origin:50% 10%;animation:arm .7s infinite ease-in-out}.arm2{animation-direction:reverse}@keyframes arm{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
.pill{background:var(--card);border-radius:14px;padding:6px 12px;align-self:center;font-size:.95rem;display:inline-block}table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid rgba(128,128,128,.3)}h3{margin:.8em 0 .2em}
@keyframes grow{0%{transform:scaleY(.1)}100%{transform:scaleY(1)}}.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 2.5s infinite alternate}
@keyframes glow{50%{opacity:.3}}.glow{animation:glow 1s infinite}@keyframes lit{0%{fill:#6aa7ff}100%{fill:#ff5a5a}}.lit{animation:lit 2s infinite alternate}
@keyframes sw{0%{transform:rotate(-30deg)}100%{transform:rotate(30deg)}}.sw{transform-box:view-box;transform-origin:60px 8px;animation:sw 1s infinite alternate ease-in-out}
@keyframes melt{to{transform:scale(.3);opacity:.4}}.melt{transform-box:fill-box;transform-origin:50% 100%;animation:melt 2.5s infinite alternate}
@keyframes pull{to{transform:translateX(-34px)}}.pull{animation:pull 1.2s infinite alternate}@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(45px);opacity:0}}.drop{animation:drop 1s infinite}
@keyframes fly{to{transform:translateX(70px) rotate(10deg)}}.fly{animation:fly 1.2s infinite alternate}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin:14px 0}
button{font:inherit;font-size:1.05rem;border:0;border-radius:18px;padding:12px 14px;background:var(--card);color:var(--fg);box-shadow:0 3px 0 rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(2px)}button.p{background:var(--ac);color:#fff}
.opt{display:block;width:100%;margin:8px 0;text-align:left}.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--no);color:#fff}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;text-align:left}
.fx{position:fixed;left:0;right:0;top:20%;font-size:2.4rem;pointer-events:none;animation:f 1.3s forwards;text-align:center}
@keyframes f{to{transform:translateY(-110px);opacity:0}}
input{font:inherit;padding:10px;border-radius:14px;border:2px solid var(--ac);width:70%;background:var(--card);color:var(--fg)}
.top{display:flex;justify-content:space-between}
</style></head><body><div id="app"></div>

const r=document.getElementById('r');r.innerHTML=`<div class="card" style="text-align:center"><div class="${ok?'dance':'shake'}" style="display:inline-block">${mascot(ok?'happy':'sad',110)}</div><h2>${ok?'Yayy! You are correct! ⭐ +1':'Oops! Not this time 💧'}</h2>${ok?'':'<p><b>Correct answer: '+q.o[q.k]+'</b></p>'}<p>${q.x}</p>${ex?'<p><b>🎁'+ex+'</b></p>':''}${btn('back','','⬅️ Back')} ${btn('listen','','🔊 Listen')} ${btn('next','',st.i+1>=st.q.length?'Finish ✅':'Next ➡️','p')}</div>`;try{r.scrollIntoView({behavior:'smooth'})}catch(e){}},
hint(){const q=st.q[st.i];if(st.done||!q)return;shuf([...document.querySelectorAll('.opt')].filter(b=>+b.dataset.v!=q.k&&!b.disabled)).slice(0,2).forEach(b=>{b.style.opacity='.25';b.disabled=true});say('Two wrong answers are gone!')},
next(){sfx();st.i++;st.done=0;play()},listen(){say(st.say)},speak(v){say(v)},
again(){sfx();h=[home,classes];classes()},
back(){sfx();clearInterval(st.tm);if(h.length>1){h.pop();h[h.length-1]()}},
mute(v,b){mute=!mute;try{speechSynthesis.cancel()}catch(e){}b.textContent=mute?'🔇':'🔊'},
rewards(){sfx();go(rewards)},wear(v){sfx();P.cost=COS[+v][0];save();rewards()},parent(){sfx();go(parent)},
pin(){const v=document.getElementById('pin').value,m=document.getElementById('pm');if(!/^\d{4}$/.test(v)){m.textContent='Please type 4 digits';return}
if(!P.pin){P.pin=v;save();st.pin=1;parent()}else if(v==P.pin){st.pin=1;parent()}else m.textContent='Wrong PIN, try again'}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b&&H[b.dataset.f])H[b.dataset.f](b.dataset.v,b)});
document.addEventListener('input',e=>{if(e.target.id=='s')sr()});
function home(){A.innerHTML=`<div style="margin-top:6vh"><div style="cursor:pointer;display:inline-block" data-f="start" data-v="rabbit">${dancer(220)}</div><h1 style="font-size:1.8rem">Welcome to Interesting Learning!</h1>${btn('start','rabbit','Start ▶','p')}</div>`}
function classes(){A.innerHTML=bar()+`<div class="card">💡 <b>Fun fact:</b> ${FACTS[st.f==null?F:st.f]} ${btn('speak',FACTS[st.f==null?F:st.f],'🔊')} ${btn('fact','','🔄 Another')}</div><h2>Choose your class 🎒</h2><div class="grid">${[...Array(12)].map((_,i)=>btn('cls',i+1,'Class '+(i+1),'p')).join('')}</div><div>${btn('retry','','🔁 Try again ('+P.wrong.length+')')} ${btn('rewards','','🎁 Rewards')} ${btn('parent','','👨‍👩‍👧 Parent corner')}</div>`}
function subs(){const s=[...new Set(D.filter(d=>d.c==st.c).map(d=>d.s))];A.innerHTML=bar()+`<h2>Class ${st.c}: pick a subject 📚</h2><div class="grid">${s.map(x=>btn('sub',x,N[x],'p')).join('')}</div>`}
function modes(){A.innerHTML=bar()+`<h2>${N[st.s]}${st.lv?(st.lv=='B'?' · Basic':' · Standard'):''}: what do you want to do? 🐰</h2>${btn('mode','M','🕵️ Mystery','opt p')}${btn('mode','L','🧪 Virtual Lab','opt p')}${btn('mode','E','💡 Explain','opt p')}${btn('mode','Q','⚡ Quick Challenge (60 seconds)','opt')}${btn('mode','T','✅ True or False','opt')}${btn('mode','R','📝 Revision notes','opt')}`}
function levels(){A.innerHTML=bar()+`<h2>Maths: choose your level 🔢</h2>${btn('lvl','B','🔰 Basic (easier, step by step)','opt p')}${btn('lvl','S','📘 Standard (full syllabus level)','opt p')}`}
function tops(){A.innerHTML=bar()+`<h2>Pick a chapter › topic 📖</h2>${btn('top','all','🎲 Mix of all','opt p')}${topics().map(x=>btn('top',x,x,'opt')).join('')}`}
function play(){const q=st.q[st.i];if(!q){clearInterval(st.tm);const n=st.q.length;A.innerHTML=bar()+`<div class="dance">${mascot('happy',150)}</div><h2>All done! 🏆</h2><p>You got <b>${st.sc}</b> of ${n} correct${st.sc?' · ⭐ +'+st.sc:''}</p>${btn('back','','⬅️ Back')} ${btn('again','','Play more','p')}`;S('ok');say('Hooray! You got '+st.sc+' out of '+n+'!');return}
const m=q.m,idx=shuf([...q.o.keys()]);
A.innerHTML=bar()+(st.m=='Q'?`<div id="tm" class="pill">⏱️ ${st.t}s</div>`:'')+`<p>Question ${st.i+1} of ${st.q.length} · ${q.ch}</p>${m=='L'?labAnim(q):`<div class="big">${q.e}</div>`}<div>${m=='L'?'🔬 Look at the experiment and observe!':m=='T'?'✅ True or false?':'🕵️ Mystery clue!'}</div><h2>${q.q}</h2>${(m=='T'?[0,1]:idx).map(i=>btn('ans',i,q.o[i],'opt')).join('')}${m=='T'?'':'<div>'+btn('hint','','💡 Hint')+'</div>'}<div id="r"></div>`}
function expl(){A.innerHTML=bar()+`<h2>${st.m=='R'?'📝 Revision notes':'💡 Explain'}</h2><input id="s" placeholder="Search any word..."><div id="l"></div>`;sr()}
const dg=d=>{const s=d.q+' '+d.x+' '+d.ch+' '+d.t,g=DIA.find(x=>x[0].test(s));return g?`<div style="text-align:center">${g[1]}<div><small>${g[2]}</small></div></div>`:''};
function sr(){const v=(document.getElementById('s').value||'').toLowerCase().trim(),l=v?D.filter(d=>(d.q+d.x+d.ch+d.t+(d.o?d.o[d.k]:'')).toLowerCase().includes(v)).slice(0,12):st.q;
document.getElementById('l').innerHTML=l.map(d=>{const a=d.o?d.o[d.k]+'. '+d.x:d.x;return`<div class="card">${d.e} <b>${d.q}</b><br>✅ ${a}${dg(d)}<br>${btn('speak',d.q+' '+a,'🔊')}</div>`}).join('')||'<p>No answer found 🐰 Try another word!</p>'}
function rewards(){A.innerHTML=bar()+`<h2>🎁 Rewards</h2><div style="display:inline-block">${dancer(130)}</div><h3>Costumes (earn ⭐ to unlock)</h3>${COS.map((c,i)=>{const on=P.stars>=c[2];return btn(on?'wear':'x',i,(on?'':'🔒 ')+c[1]+(on?'':' ('+c[2]+' ⭐)'),'opt'+(on&&P.cost==c[0]?' p':''))}).join('')}<h3>Badges</h3><div class="grid">${BD.map(b=>`<div class="card" style="text-align:center;opacity:${b[2]()?1:.3}"><div style="font-size:2rem">${b[0]}</div>${b[1]}</div>`).join('')}</div>`}
function parent(){if(!st.pin){A.innerHTML=bar()+`<h2>👨‍👩‍👧 Parent corner</h2><p>${P.pin?'Enter your 4-digit PIN':'Set a 4-digit PIN to protect this page'}</p><input id="pin" type="password" inputmode="numeric" maxlength="4" style="width:120px;text-align:center"><br><br>${btn('pin','','OK','p')}<p id="pm"></p>`;return}
const rows=Object.entries(P.st).map(([k,[a,c]])=>{const[cl,s]=k.split('|');return`<tr><td>Class ${cl} ${N[s]}</td><td>${c}/${a}</td><td>${Math.round(c/a*100)}%</td></tr>`}).join('')||'<tr><td>No quizzes played yet</td></tr>',
weak=[...new Set(P.wrong.map(i=>D[i]).map(d=>'Class '+d.c+' '+N[d.s]+': '+d.ch+' › '+d.t))].slice(0,8);
A.innerHTML=bar()+`<h2>👨‍👩‍👧 Progress report</h2><div class="card">⭐ Stars: <b>${P.stars}</b><br>📅 Days in a row: <b>${P.days}</b><br>🔥 Best answer streak: <b>${P.best}</b></div><div class="card"><b>Correct answers</b><table>${rows}</table></div><div class="card"><b>Topics to practise</b><br>${weak.length?weak.join('<br>'):'None, great job!'}</div>`}
h=[home];home();
</script></body></html>
